name: sync

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and archive latest posts
        run: python3 tools/sync.py
      - name: Translate and publish new posts
        if: env.PUBLISH_ENABLED == 'true' && env.TELEGRAM_BOT_TOKEN != ''
        run: python3 tools/publish.py
      - name: Commit snapshot
        run: |
          git config user.name "cloud-reader-bot"
          git config user.email "actions@github.com"
          git add data
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

  keepalive:
    # 自我接力：本轮结束后等待 LOOP_SECONDS 秒再触发下一轮，
    # 绕开 GitHub cron 调度不可靠的问题
    needs: sync
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Schedule next round
        env:
          GH_TOKEN: ${{ github.token }}
          LOOP_SECONDS: ${{ vars.LOOP_SECONDS || '840' }}
        run: |
          echo "waiting ${LOOP_SECONDS}s before next round"
          sleep "${LOOP_SECONDS}"
          gh workflow run sync.yml --repo "${{ github.repository }}"
