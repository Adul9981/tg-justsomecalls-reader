name: review

on:
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      BATCH_SIZE: 8
    steps:
      - uses: actions/checkout@v4
      - name: Translate latest batch for review
        run: python3 tools/review_batch.py
